[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wled-mcp"
version = "0.3.0"
description = "Unofficial MCP server for controlling WLED LED controllers over stdio or Streamable HTTP; not affiliated with the WLED project"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kai Schulte" }]
keywords = ["wled", "mcp", "led", "lighting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.12.0,<3",
    "httpx2>=2.16,<3",
    "starlette>=1.0.0,<2",
    "uvicorn>=0.31.1,<0.55",
    "anyio>=4.10,<5",
]

[project.urls]
Repository = "https://github.com/descipar/wled-mcp"
Issues = "https://github.com/descipar/wled-mcp/issues"
Documentation = "https://github.com/descipar/wled-mcp#readme"
Changelog = "https://github.com/descipar/wled-mcp/blob/main/CHANGELOG.md"

[project.scripts]
wled-mcp = "wled_mcp.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pytest>=8.4,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6.0.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wled_mcp"]

# A linked Git worktree has a `.git` file (not a directory) naming the absolute path of the
# main repository; it is not VCS-ignored and must not reach the source distribution.
[tool.hatch.build.targets.sdist]
exclude = ["/.git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.artifacts/pytest-temp"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "src",
    "scripts/check_container.py",
    "scripts/check_coverage.py",
    "scripts/check_distribution.py",
    "scripts/check_issue_content.py",
    "scripts/check_lock.py",
    "scripts/check_private_identifiers.py",
    "scripts/check_traceability.py",
    "scripts/ci_scope.py",
    "scripts/hw_http_probe.py",
    "deploy/stage_release.py",
    "tests/tool_contract.py",
]
