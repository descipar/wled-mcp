name: publish

# Builds the sdist and wheel of a `v<project.version>` tag on `main`, checks and smoke-tests
# exactly those files and publishes them to PyPI with Trusted Publishing (OIDC, no token).
# Setup, trigger design and the release procedure: docs/PUBLISHING.md. No push or pull
# request event starts this workflow; the publish job waits for the reviewers of the
# `pypi` environment.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One run per ref at a time; a running publish is never cancelled half-way.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256sums: ${{ steps.checksums.outputs.sha256sums }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Full history: the guard checks that the tagged commit is reachable from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Install the locked environment without the project
        run: uv sync --locked --no-install-project
      # Before anything is built: the ref must be the tag v<project.version> and its commit
      # the checked-out one, reachable from main. Values come from the runner environment
      # (GITHUB_REF_TYPE, GITHUB_REF_NAME, GITHUB_SHA).
      - name: Release guard
        run: uv run --frozen --no-sync python scripts/check_distribution.py --release-ref
      - run: uv sync --locked
      # The only build: the sdist, then the wheel from that sdist, with the locked hatchling.
      - name: Build the sdist and the wheel
        run: |
          test ! -e dist
          uv build --no-build-isolation --offline --no-create-gitignore --out-dir dist
      - name: Record the checksums of the built files
        run: |
          cd dist
          sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS"
          test "$(wc -l < "${RUNNER_TEMP}/SHA256SUMS")" -eq 2
      - name: Check the package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      # Installs exactly the built wheel (no rebuild) in a clean environment and runs the
      # stdio, read-only profile, HTTP restart, uvx and hub-example checks on loopback; also
      # checks the sdist and that dist/ holds only these two files.
      - name: Smoke-test the built files
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --frozen python scripts/check_distribution.py --wheel "dist/wled_mcp-${version}-py3-none-any.whl" --sdist "dist/wled_mcp-${version}.tar.gz"
      - name: Confirm the tested files and report their checksums
        id: checksums
        run: |
          (cd dist && sha256sum --strict --check "${RUNNER_TEMP}/SHA256SUMS")
          {
            echo "### wled-mcp ${GITHUB_REF_NAME#v}"
            echo
            echo "Tag \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA}\`. SHA-256 of the files handed to the publish job:"
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/SHA256SUMS"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "sha256sums<<SHA256SUMS_END"
            cat "${RUNNER_TEMP}/SHA256SUMS"
            echo "SHA256SUMS_END"
          } >> "${GITHUB_OUTPUT}"
      - run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers of this environment approve or reject the upload.
    environment:
      name: pypi
      url: https://pypi.org/project/wled-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distribution
          path: dist/
      # The checksum list stays outside dist/: the upload step accepts distributions only.
      - name: Verify the downloaded files against the tested checksums
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          printf '%s\n' "${SHA256SUMS}" | grep -v '^$' > "${RUNNER_TEMP}/SHA256SUMS"
          test "$(wc -l < "${RUNNER_TEMP}/SHA256SUMS")" -eq 2
          cd dist
          sha256sum --strict --check "${RUNNER_TEMP}/SHA256SUMS"
          test "$(find . -mindepth 1 -printf '%P\n' | sort)" = "$(cut -d ' ' -f 3- "${RUNNER_TEMP}/SHA256SUMS" | sort)"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
