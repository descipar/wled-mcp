name: bootstrap checks

on:
  # Branches are checked by their pull request only; a push to a pull-request branch must
  # not start a second identical run. `main` is checked after each merge.
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request replaces its still running checks; runs on `main`
# are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    # Native amd64 and arm64 runners (DEC-020, TD-21-8); no emulation.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "ubuntu-24.04-arm"]
        python: ["3.13"]
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull-request merge commit and both parents, for the documentation-only gate.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Documentation-only pull requests run the documentation-relevant steps (#159); any
      # doubt, every other event and every other change runs the complete suite. The step
      # always exits 0; a missing output also selects the complete suite.
      - id: scope
        name: Classify the change
        run: python scripts/ci_scope.py >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked
      - run: uv run --frozen ruff check src tests deploy scripts/check_lock.py scripts/check_distribution.py scripts/check_container.py scripts/check_traceability.py scripts/check_private_identifiers.py scripts/check_issue_content.py scripts/check_coverage.py scripts/ci_scope.py scripts/hw_http_probe.py
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --frozen ruff format --check src tests deploy scripts/check_lock.py scripts/check_distribution.py scripts/check_container.py scripts/check_traceability.py scripts/check_private_identifiers.py scripts/check_issue_content.py scripts/check_coverage.py scripts/ci_scope.py scripts/hw_http_probe.py
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --frozen mypy
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --frozen python scripts/check_agent_setup.py
      - run: uv run --frozen python scripts/check_lock.py
        if: steps.scope.outputs.docs_only != 'true'
      - name: Provide private denylist from secret
        env:
          PRIVATE_DENYLIST: ${{ secrets.WLED_MCP_PRIVATE_DENYLIST }}
        run: |
          if [ -z "${PRIVATE_DENYLIST}" ]; then
            echo "note: no private denylist secret (for example a fork pull request); rule checks only"
            exit 0
          fi
          umask 077
          denylist="${RUNNER_TEMP}/private-denylist.txt"
          printf '%s\n' "${PRIVATE_DENYLIST}" > "${denylist}"
          echo "WLED_MCP_PRIVATE_DENYLIST=${denylist}" >> "${GITHUB_ENV}"
      - run: uv run --frozen python scripts/check_private_identifiers.py
      - run: uv run --frozen pytest
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --frozen python scripts/check_distribution.py
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --frozen pytest $(python scripts/ci_scope.py tests)
        if: steps.scope.outputs.docs_only == 'true'
      - run: git diff --exit-code

  container:
    # HTTP image per native architecture: stage a non-release build, build the image,
    # start it on loopback and run one MCP tools/list. No push, no LAN (TD-21-8).
    # Runs for pull requests and pushes to main only, to bound private-plan minutes.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "ubuntu-24.04-arm"]
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked
      - name: Stage a non-release build of this commit
        run: uv run --frozen python deploy/stage_release.py --non-release --output "${RUNNER_TEMP}/release"
      - name: Build and smoke-test the image
        run: |
          set -- "${RUNNER_TEMP}"/release/*/
          test "$#" -eq 1
          uv run --frozen python scripts/check_container.py "$1"
      - run: git diff --exit-code
