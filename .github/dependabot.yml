version: 2
updates:
  # Update the real manifest AND uv.lock; pip-only updates could leave the lock stale.
  # One grouped PR per month keeps review and CI noise low; security updates
  # are grouped too but are not delayed by the monthly schedule.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      uv-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
